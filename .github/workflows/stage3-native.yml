name: Application complete checks
on:
  push:
    branches: [stage3-native-check, stage3-iphone, stage4-iphone, stage5-iphone, stage6-iphone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows application tests
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test CI runner and rejection of incomplete XCTest reports
        run: python -m unittest discover -s mobile/tool -p "test_*.py" -v
      - name: Set up pinned SDK, analyze and run all application tests
        shell: cmd
        run: setup-windows.cmd
  native:
    name: iOS XCTest and native checks
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test clock crash recovery and notification deadlines
        run: bash mobile/tool/run_native_safety.sh
      - name: Test native state validation and interrupted writes
        run: bash mobile/tool/run_native_storage.sh
      - name: Test microphone signal and capture lifetime
        run: bash mobile/tool/run_native_voice.sh
      - name: Test presentation profile and bundled narration policy
        run: bash mobile/tool/run_native_presentation.sh
      - name: Test ambient and microphone audio ownership
        run: bash mobile/tool/run_native_ambient.sh
      - name: Test CI runner and XCTest result validation
        run: python3 -m unittest discover -s mobile/tool -p "test_*.py" -v
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ae9b586f34a8443573f82ef57c3bf914a908cbf7
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare verified assets
        run: python3 -m research.prepare_mobile
      - name: Prepare iOS SDK
        timeout-minutes: 12
        working-directory: mobile
        run: |
          xcodebuild -version
          uname -m
          flutter config --no-analytics --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get --enforce-lockfile
      - name: Build once and run every iOS test through XCTest
        timeout-minutes: 45
        working-directory: mobile
        run: python3 tool/run_ios_test.py
      - name: Preserve XCTest results and launch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage3-xctest-results
          path: |
            mobile/build/ios_ci/*.log
            mobile/build/ios_ci/*.json
            mobile/build/ios_ci/Tests.xcresult
          if-no-files-found: warn
          retention-days: 1
