name: universe_lab
description: Local bilingual iPhone validation bench for Ask the Universe.
publish_to: none
version: 0.3.5+7
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  crypto: 3.0.7
  dart_sentencepiece_tokenizer: 1.4.1
  onnxruntime_v2: 1.23.2+2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/stage2/model.onnx
    - assets/stage2/tokenizer.json
    - assets/stage2/head.json
