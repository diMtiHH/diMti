name: universe_lab
description: Local bilingual iPhone validation bench for Ask the Universe.
publish_to: none
version: 0.6.3+13
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  crypto: 3.0.7
  dart_sentencepiece_tokenizer: 1.4.1
  onnxruntime_v2: 1.23.2+2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  shaders:
    - shaders/aura_environment.frag
    - shaders/aura_matter.frag
    - shaders/aura_metal.frag
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Light.ttf
          weight: 300
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Medium.ttf
          weight: 500
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/CormorantGaramond-OFL.txt
    - assets/fonts/Literata-OFL.txt
    - assets/audio/ambient/
    - assets/onboarding/script.json
    - assets/onboarding/narration.json
    - assets/onboarding/ru.wav
    - assets/onboarding/en.wav
    - assets/stage2/model.onnx
    - assets/stage2/tokenizer.json
    - assets/stage2/head.json
